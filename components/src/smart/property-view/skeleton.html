<!-- sf-property-view skeleton (standard simai.smart-component 1.3.8 §5.4; simai/ui-pro#3): settings only, no
     data and no script. The section tabs' strip (sections-as tabs) and three groups of field bars, in the boxes
     the loaded record takes, so nothing moves when it comes. -->
<sf-property-view data-state="loading" aria-busy="true" data-sf-static="skeleton">
  <div class="sf-property-view-tabs sf-property-view-tabs--skeleton flex items-cross-center gap-2" aria-hidden="true" data-sf-skeleton="tabs">
    <div class="flex-none" style="inline-size: 6rem"><div class="sf-skeleton sf-skeleton--animation-pulse"><div class="sf-skeleton-text sf-skeleton-text--size-1 w-3/4"></div></div></div>
    <div class="flex-none" style="inline-size: 6rem"><div class="sf-skeleton sf-skeleton--animation-pulse"><div class="sf-skeleton-text sf-skeleton-text--size-1 w-2/3"></div></div></div>
    <div class="flex-none" style="inline-size: 6rem"><div class="sf-skeleton sf-skeleton--animation-pulse"><div class="sf-skeleton-text sf-skeleton-text--size-1 w-1/2"></div></div></div>
  </div>
  <div class="sf-property-view-loading flex flex-col gap-4" data-state="loading">
    <div class="flex flex-col gap-2" data-sf-repeat="groups">
      <div class="sf-skeleton sf-skeleton--animation-pulse" aria-hidden="true"><div class="sf-skeleton-text sf-skeleton-text--size-1 w-1/3"></div></div>
      <div class="flex flex-col gap-1/2"><div class="sf-skeleton sf-skeleton--animation-pulse" aria-hidden="true"><div class="sf-skeleton-text sf-skeleton-text--size-1/2 w-2/3"></div></div><div class="sf-skeleton sf-skeleton--animation-pulse" aria-hidden="true"><div class="sf-skeleton-text sf-skeleton-text--size-1 w-1/2"></div></div></div>
      <div class="flex flex-col gap-1/2"><div class="sf-skeleton sf-skeleton--animation-pulse" aria-hidden="true"><div class="sf-skeleton-text sf-skeleton-text--size-1/2 w-1/2"></div></div><div class="sf-skeleton sf-skeleton--animation-pulse" aria-hidden="true"><div class="sf-skeleton-text sf-skeleton-text--size-1 w-3/4"></div></div></div>
      <div class="flex flex-col gap-1/2"><div class="sf-skeleton sf-skeleton--animation-pulse" aria-hidden="true"><div class="sf-skeleton-text sf-skeleton-text--size-1/2 w-3/4"></div></div><div class="sf-skeleton sf-skeleton--animation-pulse" aria-hidden="true"><div class="sf-skeleton-text sf-skeleton-text--size-1 w-2/5"></div></div></div>
    </div>
    <span class="sr-only" role="status">Загрузка</span>
  </div>
</sf-property-view>
