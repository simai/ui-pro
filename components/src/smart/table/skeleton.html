<!-- sf-table skeleton (standard simai.smart-component 1.3.8 §5.4): settings only, no data and no script.
     The toolbar, the head and one row per pagination-page-size (presentation.skeleton.repeat.rows), each
     cell a bar of the text's height, so the box is the loaded box of a list of one-line rows. -->
<section class="sf-table min-w-0 flex flex-col gap-1/3 flex-1 min-h-0" data-state="loading" aria-busy="true" data-sf-static="skeleton">
  <div class="sf-table-toolbar flex items-cross-center gap-1/3" aria-hidden="true">
    <div class="sf-table-skeleton-control"></div>
    <div class="sf-skeleton sf-skeleton--animation-pulse flex-1"><div class="sf-skeleton-text sf-skeleton-text--size-1/2 w-1/3"></div></div>
  </div>
  <div class="table-wrap min-w-0 max-w-full flex flex-col flex-1 min-h-0">
    <div class="sf-table-scroll min-h-0 min-w-0 overflow-auto flex-1 relative">
      <table class="table border-separate border-spacing-0 min-w-full w-max table-fixed">
        <thead class="sticky top-0 z-5"><tr><th><div class="sf-table-skeleton-control" aria-hidden="true"></div></th><th aria-hidden="true"><div class="sf-skeleton sf-skeleton--animation-pulse"><div class="sf-skeleton-text sf-skeleton-text--size-1/2 w-1/2"></div></div></th></tr></thead>
        <tbody data-state="loading" class="sf-table-skeleton">
          <tr aria-hidden="true" data-sf-repeat="rows"><td><div class="sf-table-skeleton-control"></div></td><td><div class="sf-skeleton sf-skeleton--animation-pulse"><div class="sf-skeleton-text sf-skeleton-text--size-1/2 w-3/4"></div></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <span class="sf-table-visually-hidden" role="status">Загрузка данных</span>
</section>
