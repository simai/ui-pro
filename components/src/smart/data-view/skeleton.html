<!-- sf-data-view skeleton (standard simai.smart-component 1.3.8 §5.4): settings only, no data and no script.
     The toolbar, the table's loading rows (one per row-cap, or the table's page) and the page row as bars,
     in the boxes the loaded view takes. -->
<sf-data-view data-state="loading" aria-busy="true" data-sf-static="skeleton">
  <div class="flex flex-col gap-1">
    <div class="flex gap-1/3" aria-hidden="true">
      <div class="sf-skeleton sf-skeleton--animation-pulse flex-1"><div class="sf-skeleton-text sf-skeleton-text--size-1/2 w-1/3"></div></div>
    </div>
    <div class="sf-table-skeleton" aria-hidden="true">
      <div class="sf-skeleton sf-skeleton--animation-pulse" data-sf-repeat="rows"><div class="sf-skeleton-text sf-skeleton-text--size-1/2 w-3/4"></div></div>
    </div>
    <div class="flex gap-1/3" aria-hidden="true">
      <div class="sf-skeleton sf-skeleton--animation-pulse"><div class="sf-skeleton-text sf-skeleton-text--size-1/2 w-1/4"></div></div>
    </div>
    <span class="sf-table-visually-hidden" role="status">Загрузка данных</span>
  </div>
</sf-data-view>
